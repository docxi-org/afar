[package]
name = "afar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29"
fluent-bundle = "0.16.0"
portable-pty = "0.9"
ratatui = "0.30"
rmcp = { version = "3.5", features = ["transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "net"] }
trash = "5.2.9"
unic-langid = "0.9.6"
regex = "1.13"
vt100 = { path = "vendor/vt100" }
notify = "8"
toml = "1.1.6"
toml_edit = "0.25.15"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
unicode-width = "0.2.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory"] }

# Vendored with afar patches (AFAR-PATCH markers); ratatui uses it too.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
