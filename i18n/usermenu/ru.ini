; Меню пользователя afar (F2) в формате FarMenu.ini, как в Far.
; «клавиша: название» с начала строки, команды пункта — строками с отступом;
; { и } после пункта — подменю; «--:» — разделитель.
; Метасимволы Far — !.! имя файла, !& выделенные, !\ папка, !?Заголовок?значение! — спросить.
; Свои команды afar — @agent текст (агенту), @view файл, @edit файл.
; Меню папки — FarMenu.ini в ней; это — общее (F4 в меню — править файл).
A: Спросить агента о выделенных файлах
   @agent !?Вопрос агенту о файлах?! — файлы !& в папке !\
E: Объяснить файл под курсором
   @agent Объясни, что в файле !\!.!
R: Ревью изменений в этой папке
   @agent Сделай ревью незакоммиченных изменений в папке !\ (git diff)
--:
G: git status
   git status
L: git log (последние 20)
   git log --oneline -20
