; afar's user menu (F2) in Far's FarMenu.ini format.
; "hotkey: label" at the line's start, the item's commands indented;
; { and } after an item — a submenu; "--:" — a separator.
; Far's metasymbols — !.! the file's name, !& the selected ones, !\ the folder, !?Title?value! — ask.
; afar's own commands — @agent text (to the agent), @view file, @edit file.
; A folder's menu is FarMenu.ini in it; this one is common (F4 in the menu edits the file).
A: Ask the agent about the selected files
   @agent !?Question for the agent?! — files !& in the folder !\
E: Explain the file under the cursor
   @agent Explain what is in the file !\!.!
R: Review the changes in this folder
   @agent Review the uncommitted changes in the folder !\ (git diff)
--:
G: git status
   git status
L: git log (last 20)
   git log --oneline -20
