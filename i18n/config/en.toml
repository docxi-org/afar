# afar settings. afar reads this file at start; the settings dialogs
# (F9 → Options) write their changes here, keeping these comments.

[general]
# Interface language: "en", "ru", "de", … (Far's 13 languages).
# Empty: the Windows interface language. The AFAR_LANG variable wins.
language = ""

[panels]
# Gray + and Gray * select folders too (Far: "Select folders").
select_folders = false
# Show hidden and system files (Ctrl+H in the panels).
show_hidden = true
# Lines one mouse wheel notch moves in panels and lists; 0: as set in Windows
# ("Mouse → Wheel", usually 3), as Far does.
wheel_lines = 0

[hints]
# Hints: the mouse rests on something and a block next to it tells about it.
enabled = true
delay_ms = 600                # milliseconds before a hint shows
files = true                  # files in the panels: name, size, times, attributes, the agent's changes
keybar = true                 # the key bar: what a key does
agent = true                  # the agent's frame: its session and state
panels = true                 # the panels' titles: the sort, what a column shows
status = true                 # the status lines of the viewer and the editor
marks = true                  # the agent's marks and proposals in the viewer and the editor
menus = true                  # menus: the whole text of a cut item, why an item is grey

[confirm]
# Ask before deleting a folder that is not empty.
delete_folder = true
# Ask before deleting a read-only file.
read_only = true
# Esc during a file operation asks before cancelling it.
esc = true
# Opening a file already open in the editor asks how: the open window, a new
# instance, or read it again (a modified one always asks).
reedit = true
# The agent menu asks before /compact, /clear and before ending the running
# agent (a new or another session, restart, permission mode).
agent = true

[agent]
# The agent in the bottom pane and its extra arguments (afar adds its own:
# MCP server, hooks, system prompt, session).
command = "claude"
args = []
# afar's start: "last" continues the agent's last conversation in this folder
# (if afar has worked there), "new" starts a new one. A new one can always be
# started from the agent's menu (F9 on the agent).
on_start = "last"
# Start in live mode: your actions go with each prompt to the agent.
# Otherwise the agent reads the journal when it needs it.
live = false
# Where the agent pane is: "bottom" — below the panels, "top" — above them.
position = "bottom"
# afar as the agent's "IDE" (Claude Code's IDE protocol, experimental): the
# agent sees the viewer's selection, Ctrl+Enter in the viewer sends it a
# reference to the lines, edits Claude Code asks about can be accepted in an
# afar dialog. Applies when afar starts next time.
ide = false
# afar wakes the agent with events (Claude Code's Channels, experimental): an
# event starts the agent's turn without typing in its pane. Needs a claude.ai
# login or a Console key. Applies when the agent starts next time.
channels = false
# Claude Code asks to confirm the development channel on every start ("I am
# using this for local development"). true: afar answers itself when only its
# own channel (server:afar-channel) is listed, and says so in the message line.
# It is Claude Code's warning: turn this on only if you agree to confirm it
# in advance.
confirm_channels = false
# The agent's test tools: it presses keys in afar, types, clicks and takes
# screenshots (text with colors or a PNG picture) to test afar by itself.
# The keys count as yours, past the permissions below: turn this on only
# while testing. Applies when afar starts next time.
test_tools = false

[agent.permissions]
# What the agent may do through afar (its afar_* tools):
#   "allow"   — without asking,
#   "confirm" — after your confirmation in a dialog,
#   "deny"    — never.
# The agent's own tools (Bash, Edit, Write) are asked about by Claude Code.
navigate = "allow"          # move the panels' cursor, change folders, select
mkdir = "allow"             # create folders
copy = "confirm"
move = "confirm"            # move and rename
delete = "confirm"          # to the recycle bin
delete_permanent = "deny"   # bypassing the recycle bin
run_command = "confirm"     # run a command in the command line
edit_buffer = "allow"       # change the text of a file open in afar's editor (you save it, F2)

[viewer]
# The command line stays visible in the viewer (F3); Far hides it.
# The agent pane then keeps its place when a viewer opens.
command_line = true
# The rest is Far's "Options → Viewer settings".
# The external viewer: on F3 instead of Alt+F3; !.! is the file name,
# without it the name goes at the end.
external_f3 = false
external_command = ""
persistent_selection = true   # keys do not drop the selection
tab_size = 8
show_arrows = true            # scrolling arrows at the ends of lines
show_zero = false             # the zero character as "·"
scrollbar = false
syntax = true                 # syntax highlighting (Alt+F3 in a window)
line_numbers = false          # line numbers (Ctrl+F3 in a window)
# What to remember about a file: position, code page, bookmarks, mode
# (text, hex, dump), wrapping.
save_position = true
save_codepage = true
save_bookmarks = true
save_mode = true
save_wrap = false
max_line = 10000              # maximum line width
detect_dump = true            # open binary files as a dump
autodetect_codepage = true
default_codepage = 0          # 0: the Windows ANSI code page, else a number (866, 65001…)

[editor]
# As "Options → Editor settings" in Far (the same dialog is there; Alt+Shift+F9
# in the editor changes the settings of that window only).
# External editor: on F4 instead of the built-in one; !.! is the file name,
# without it the name goes at the end.
external_f4 = false
external_command = ""
expand_tabs = "keep"          # keep: tabs stay, new: typed tabs as spaces, all: every tab as spaces
tab_size = 8
persistent_blocks = false     # persistent blocks: the selection stays when the cursor moves
del_removes_blocks = true     # Del and BS delete the selected block
auto_indent = false           # Enter puts the cursor at the indent of the line above
show_whitespace = "off"       # off, all: spaces, tabs and line endings, no_eol: without line endings
cursor_beyond_eol = true      # the cursor may go past the end of a line
search_select_found = false   # select what search finds
search_cursor_at_end = false  # the cursor after the match, not on it
scrollbar = false
line_numbers = false
syntax = true                 # syntax highlighting (Alt+F3 in a window)
save_position = true          # remember where a file was left (and its code page)
save_bookmarks = true
autodetect_codepage = true
default_codepage = 0          # 0: the Windows ANSI code page, else a number (866, 65001…)

[editor.agent]
# Markers in the text: a line that starts with a marker (or a code comment
# with one) goes to the agent as an instruction. Typed in any keyboard layout.
markers = ["!!", "@ai"]       # the agent decides; "@ai?": answer only, "@ai!": change the text
answer_markers = ["??"]       # answer only: a note in the margin, the text stays
marker_in_comments = true     # in code comments too (by the file's extension)
marker_trigger = "enter"      # enter: Enter at the line's end, save: on saving, both
marker_remove = true          # the marker line leaves the text when it goes to the agent
# The agent's changes in the editor: direct — at once (marked, one Ctrl+Z
# undoes them), propose — all as proposals (accept Alt+F5, reject Alt+F6),
# mixed — new text at once, a change or removal of your text as a proposal.
apply = "mixed"

[autocomplete]
# Autocompletion as in Far ("Options → AutoComplete settings").
dialogs = true            # in dialogs' fields with a history or a path
command_line = true
# What appears as you type: "ghost" — the rest of the best match in grey after
# the text (→ at the end of the line takes it, Ctrl+→ a word), the list on
# Ctrl+Space in dialogs; "list" — the list of matches, as in Far; "off" — nothing.
suggest = "ghost"
modal = false             # the list takes the keys: moving in it does not change the field
fuzzy = true              # also matches with the letters in order anywhere (lower, highlighted)
# Sources: "always", "ctrl_space" (only on Ctrl+Space), "never".
history = "always"        # the field's or the commands' history
files = "always"          # files and folders
variables = "always"      # %VARIABLES%
programs = "always"       # programs on PATH (the command line)

[history]
dialogs = true            # history of dialogs' fields
commands = true           # history of commands
skip_leading_space = true # a command starting with a blank is not kept
redact_secrets = true     # passwords, tokens, keys become *** in the history
order = "frecency"        # "frecency": by how often and how lately, this folder's first; "recent": the newest first (Far)
agent_entries = "marked"  # the agent's entries: "marked" (marked, after yours) or "mixed"
