# Настройки afar. afar читает этот файл при запуске; окна настроек
# (F9 → Параметры) записывают свои изменения сюда, сохраняя комментарии.

[general]
# Язык интерфейса: "en", "ru", "de", … (13 языков Far).
# Пусто — язык интерфейса Windows. Переменная AFAR_LANG важнее.
language = ""

[panels]
# Серые + и * помечают и папки (в Far — «Помечать папки»).
select_folders = false

[confirm]
# Спрашивать перед удалением непустой папки.
delete_folder = true
# Спрашивать перед удалением файла «только для чтения».
read_only = true
# Esc во время файловой операции спрашивает, прервать ли её.
esc = true

[agent]
# Агент в нижней панели и его дополнительные аргументы (свои afar
# добавляет сам: MCP-сервер, хуки, системный промпт, сессию).
command = "claude"
args = []
# Запуск в режиме live: ваши действия уходят агенту с каждым запросом.
# Иначе агент читает журнал, когда ему нужно.
live = false
# Где панель агента: "bottom" — под панелями, "top" — над ними.
position = "bottom"
# afar — «IDE» агента (протокол IDE Claude Code, опыт): агент видит выделенное
# в просмотрщике, Ctrl+Enter в просмотрщике отправляет ему ссылку на строки,
# правки, которые Claude Code спрашивает, можно принять в диалоге afar.
# Применяется при следующем запуске afar.
ide = false
# afar будит агента событиями (Channels Claude Code, опыт): событие начинает
# ход агента без ввода в его панели. Нужен вход через claude.ai или ключ
# Console. Применяется при следующем запуске агента.
channels = false

[agent.permissions]
# Что агенту можно делать через afar (его инструменты afar_*):
#   "allow"   — без спроса,
#   "confirm" — после вашего подтверждения в диалоге,
#   "deny"    — никогда.
# Свои инструменты агента (Bash, Edit, Write) подтверждает Claude Code.
navigate = "allow"          # двигать курсор панелей, менять папки, выделять
mkdir = "allow"             # создавать папки
copy = "confirm"
move = "confirm"            # перемещать и переименовывать
delete = "confirm"          # в Корзину
delete_permanent = "deny"   # минуя Корзину
run_command = "confirm"     # выполнить команду в командной строке

[viewer]
# Командная строка остаётся видна при просмотре (F3); в Far она скрыта.
# Тогда панель агента не сдвигается, когда открывается просмотр.
command_line = true
