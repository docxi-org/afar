# Настройки afar. afar читает этот файл при запуске; окна настроек
# (F9 → Параметры) записывают свои изменения сюда, сохраняя комментарии.

[general]
# Язык интерфейса: "en", "ru", "de", … (13 языков Far).
# Пусто — язык интерфейса Windows. Переменная AFAR_LANG важнее.
language = ""

[panels]
# Серые + и * помечают и папки (в Far — «Помечать папки»).
select_folders = false
# На сколько строк двигает один шаг колеса мыши в панелях и списках; 0 — как
# задано в Windows («Мышь → Колесико», обычно 3), так же делает Far.
wheel_lines = 0

[confirm]
# Спрашивать перед удалением непустой папки.
delete_folder = true
# Спрашивать перед удалением файла «только для чтения».
read_only = true
# Esc во время файловой операции спрашивает, прервать ли её.
esc = true
# Открытие файла, уже открытого в редакторе, спрашивает: текущее окно,
# новая копия или перечитать (изменённый — спрашивает всегда).
reedit = true
# Меню агента спрашивает перед /compact, /clear и перед тем, как завершить
# работающего агента (новая или другая сессия, перезапуск, режим разрешений).
agent = true

[agent]
# Агент в нижней панели и его дополнительные аргументы (свои afar
# добавляет сам: MCP-сервер, хуки, системный промпт, сессию).
command = "claude"
args = []
# Запуск afar: "last" — продолжить последний разговор агента в этой папке
# (если afar в ней уже работал), "new" — новый разговор. Новый всегда можно
# начать из меню агента (F9 на агенте).
on_start = "last"
# Запуск в режиме live: ваши действия уходят агенту с каждым запросом.
# Иначе агент читает журнал, когда ему нужно.
live = false
# Где панель агента: "bottom" — под панелями, "top" — над ними.
position = "bottom"
# afar — «IDE» агента (протокол IDE Claude Code, опыт): агент видит выделенное
# в просмотрщике, Ctrl+Enter в просмотрщике отправляет ему ссылку на строки,
# правки, которые Claude Code спрашивает, можно принять в диалоге afar.
# Применяется при следующем запуске afar.
ide = false
# afar будит агента событиями (Channels Claude Code, опыт): событие начинает
# ход агента без ввода в его панели. Нужен вход через claude.ai или ключ
# Console. Применяется при следующем запуске агента.
channels = false
# Claude Code при каждом запуске спрашивает подтверждение для канала разработки
# («I am using this for local development»). true — afar отвечает сам, если в
# вопросе только его канал (server:afar-channel), и пишет об этом в строке
# сообщений. Это предупреждение Claude Code: включайте, только если согласны
# подтверждать его заранее.
confirm_channels = false
# Тестовые инструменты агента: он нажимает клавиши в afar, печатает, щёлкает
# мышью и снимает экран (текстом с цветами или картинкой PNG) — чтобы
# проверять afar самому. Нажатия идут как ваши, мимо разрешений ниже:
# включайте только на время проверки. Применяется при следующем запуске afar.
test_tools = false

[agent.permissions]
# Что агенту можно делать через afar (его инструменты afar_*):
#   "allow"   — без спроса,
#   "confirm" — после вашего подтверждения в диалоге,
#   "deny"    — никогда.
# Свои инструменты агента (Bash, Edit, Write) подтверждает Claude Code.
navigate = "allow"          # двигать курсор панелей, менять папки, выделять
mkdir = "allow"             # создавать папки
copy = "confirm"
move = "confirm"            # перемещать и переименовывать
delete = "confirm"          # в Корзину
delete_permanent = "deny"   # минуя Корзину
run_command = "confirm"     # выполнить команду в командной строке
edit_buffer = "allow"       # править текст файла, открытого в редакторе afar (сохраняете вы, F2)

[viewer]
# Командная строка остаётся видна при просмотре (F3); в Far она скрыта.
# Тогда панель агента не сдвигается, когда открывается просмотр.
command_line = true
# Остальное — как «Параметры → Настройки программы просмотра» в Far.
# Внешняя программа просмотра: по F3 вместо Alt+F3; !.! — имя файла,
# без него имя дописывается в конец.
external_f3 = false
external_command = ""
persistent_selection = true   # клавиши не снимают выделение
tab_size = 8
show_arrows = true            # стрелки сдвига у краёв строк
show_zero = false             # нулевой символ как «·»
scrollbar = false
syntax = true                 # подсветка синтаксиса (Alt+F3 — в окне)
line_numbers = false          # номера строк (Ctrl+F3 — в окне)
# Что запоминать о файле: позицию, кодовую страницу, закладки, режим
# (текст, hex, дамп), перенос.
save_position = true
save_codepage = true
save_bookmarks = true
save_mode = true
save_wrap = false
max_line = 10000              # максимальная ширина строки
detect_dump = true            # двоичный файл открывать дампом
autodetect_codepage = true
default_codepage = 0          # 0 — ANSI Windows, иначе номер (866, 65001…)

[editor]
# Как «Параметры → Настройки редактора» в Far (там же — диалог; Alt+Shift+F9
# в редакторе меняет настройки только этого окна).
# Внешний редактор: по F4 вместо встроенного; !.! — имя файла, без него
# имя дописывается в конец.
external_f4 = false
external_command = ""
expand_tabs = "keep"          # keep — оставлять Tab, new — новые Tab пробелами, all — все Tab пробелами
tab_size = 8
persistent_blocks = false     # постоянные блоки: выделение остаётся, когда курсор уходит
del_removes_blocks = true     # Del и BS удаляют выделенный блок
auto_indent = false           # Enter ставит курсор на отступ строки выше
show_whitespace = "off"       # off, all — пробелы, Tab и концы строк, no_eol — без концов строк
cursor_beyond_eol = true      # курсор за пределами строки
search_select_found = false   # выделять найденное
search_cursor_at_end = false  # курсор в конце найденного
scrollbar = false
line_numbers = false
syntax = true                 # подсветка синтаксиса (Alt+F3 — в окне)
save_position = true          # помнить позицию файла (и кодовую страницу)
save_bookmarks = true
autodetect_codepage = true
default_codepage = 0          # 0 — ANSI Windows, иначе номер (866, 65001…)

[editor.agent]
# Маркеры в тексте: строка, которая начинается с маркера (или комментарий кода
# с ним), уходит агенту как указание. Набираются без смены раскладки.
markers = ["!!", "@ai"]       # агент решает сам; "@ai?" — только ответ, "@ai!" — править текст
answer_markers = ["??"]       # только ответ: заметкой на полях, текст не трогать
marker_in_comments = true     # и в комментариях кода (по расширению файла)
marker_trigger = "enter"      # enter — по Enter в конце строки, save — при сохранении, both
marker_remove = true          # строка маркера убирается, когда уходит агенту
# Правки агента в редакторе: direct — сразу (подсвечены, отменяются одним
# Ctrl+Z), propose — все предложениями (принять Alt+F5, отклонить Alt+F6),
# mixed — новый текст сразу, изменение и удаление вашего текста — предложением.
apply = "mixed"

[autocomplete]
# Автозавершение, как в Far («Параметры → Настройки автозавершения»).
dialogs = true            # в полях диалогов с историей или путём
command_line = true
# Подсказка при наборе: "ghost" — серое продолжение лучшего варианта после
# текста (→ в конце строки принимает его, Ctrl+→ — по слову), список — по
# Ctrl+Space в диалогах; "list" — список вариантов, как в Far; "off" — ничего.
suggest = "ghost"
modal = false             # список забирает клавиши: движение по нему не меняет поле
fuzzy = true              # и варианты с буквами по порядку где угодно (ниже, с подсветкой)
# Источники: "always" — всегда, "ctrl_space" — только по Ctrl+Space, "never".
history = "always"        # история поля или команд
files = "always"          # файлы и папки
variables = "always"      # %ПЕРЕМЕННЫЕ%
programs = "always"       # программы из PATH (командная строка)

[history]
dialogs = true            # история полей диалогов
commands = true           # история команд
skip_leading_space = true # команда с пробелом в начале не запоминается
redact_secrets = true     # пароли, токены, ключи — как *** в истории
order = "frecency"        # "frecency" — по частоте и свежести, выше записи этой папки; "recent" — новые сверху (как в Far)
agent_entries = "marked"  # записи агента: "marked" — помечены и ниже ваших; "mixed" — наравне
